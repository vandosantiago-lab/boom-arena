<style>
:root{

  --night:#0d0b24; --panel:#1a1640; --panel-2:#272160; --star:#ffd92e; --star-deep:#e09a00;
  --ink:#f6f2ff; --muted:#aaa4d8; --danger:#ff5468; --ok:#7dff9b;
  --display:'Bangers','Impact','Arial Black',sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}#hud{pointer-events:none;z-index:2}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#top,#side{position:fixed;top:10px;right:10px;display:none;gap:6px;z-index:3}
#side{top:132px;right:auto;left:8px}
#top button,#side button{height:38px;min-width:38px;padding:0 9px;border-radius:12px;background:rgba(13,11,36,.72);border:2px solid rgba(255,255,255,.22);font-weight:800;font-size:11px;letter-spacing:.03em}
#pad{position:fixed;right:12px;bottom:16px;width:190px;height:110px;display:none;z-index:3;pointer-events:none}
#pad button{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;font-family:var(--display);letter-spacing:.04em;border:3px solid rgba(255,255,255,.55);background:rgba(13,11,36,.7);text-shadow:0 2px 0 rgba(0,0,0,.45)}
#bPow{right:0;bottom:0;width:96px;height:96px;font-size:21px;line-height:1}
#bPow small{display:block;font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:0;opacity:.9;margin-top:3px;text-shadow:none}
#bDash{right:106px;bottom:2px;width:64px;height:64px;font-size:16px}
.cd{filter:saturate(.3) brightness(.65)}
#bCtx{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;display:none;font-family:var(--display);font-size:21px;letter-spacing:.05em;padding:10px 18px;border-radius:16px;background:var(--star);color:#2a1f00;border:3px solid #fff3a8;box-shadow:0 5px 0 rgba(0,0,0,.4);white-space:nowrap}
#bCtx.lock{background:#55507e;color:#fff;border-color:#8a84b8}
.playing #top,.playing #side{display:flex}.playing #pad{display:block}

#ov{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;background:rgba(8,6,24,.74)}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.03em}
.logo{font-size:clamp(58px,19vw,104px);line-height:.86;color:var(--star);transform:skew(-9deg) rotate(-3deg);
  -webkit-text-stroke:2px #3a2d00;text-shadow:4px 5px 0 var(--star-deep),7px 9px 0 rgba(0,0,0,.55)}
.sub{font-family:var(--display);font-size:clamp(22px,6.4vw,30px);letter-spacing:.14em;display:inline-block;align-self:center;padding:0 6px 4px;border-bottom:5px solid var(--star)}
.by{font-size:14px;color:var(--muted);margin:0}.by b{color:var(--ink);font-weight:800;letter-spacing:.05em}

p{margin:0;line-height:1.45;font-size:15px}
.btns{display:flex;flex-direction:column;gap:9px}
.btn{font-family:var(--display);font-size:24px;letter-spacing:.06em;padding:11px 16px;border-radius:16px;background:var(--panel-2);border:3px solid rgba(255,255,255,.3);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.btn.go{background:var(--star);color:#2a1f00;border-color:#fff3a8}
.btn:active,.up:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.how{text-align:left;background:rgba(13,11,36,.8);border:2px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.4}
.how b{color:var(--star)}
.up{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:16px;background:var(--panel-2);border:3px solid rgba(255,255,255,.25);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.up i{flex:none;width:42px;height:42px;border-radius:12px;background:var(--night);display:grid;place-items:center;font:400 24px/1 var(--display);font-style:normal}
.up div{flex:1;min-width:0}
.up b{display:block;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.04em}
.up span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.up em{flex:none;font-style:normal;font-family:var(--display);font-size:18px;padding:5px 9px;border-radius:10px;background:var(--star);color:#2a1f00;font-variant-numeric:tabular-nums}

.coin{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--star);border:2px solid #fff3a8;margin-right:5px;vertical-align:-1px}
.spin{font-family:var(--display);font-size:44px;padding:18px 0;border-radius:16px;background:var(--night)}
#mascot{width:104px;height:104px}
.tl{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}.tl .logo{margin:0}.tl .l2{margin-left:-.5em}
.trow{display:flex;align-items:center;gap:8px;margin:-10px 0 -26px 4.4em;position:relative;z-index:1}
.by2{font-family:var(--display);font-size:19px;line-height:1.05;letter-spacing:.08em;text-align:left;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.btn.off{opacity:.45}.btn.mus{font-size:19px;background:rgba(13,11,36,.8);display:flex;align-items:center;justify-content:center;gap:10px}

#bCrew{font-size:10px}
@media (max-height:520px){.logo{font-size:50px}#mascot{width:64px;height:64px}.trow{margin:-8px 0 -16px 3em}.how{display:none}#pad{transform:scale(.84);transform-origin:bottom right}}
body{position:fixed;inset:0;width:100%;touch-action:none;-webkit-touch-callout:none}button{touch-action:manipulation}
#ov{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#top button,#side button{height:42px;min-width:42px}
@media (max-width:700px){#bCtx{bottom:136px;max-width:calc(100% - 16px);font-size:min(21px,5vw);padding:10px 12px}}
@media (prefers-reduced-motion:reduce){.btn:active,.up:active{transform:none}}
</style>
</head>

  const sg=own(new T.RingGeometry(w.range*.45,w.range,14,1,p.rot-Math.PI/2-w.arc/2,w.arc));sg.rotateX(-Math.PI/2);const sm=new T.MeshBasicMaterial({color:p.sword?w.c:0xffffff,transparent:true,opacity:.8,side:T.DoubleSide,depthWrite:false});sm.userData.own=true;

function usePower(){if(state!=='play'||G.frz>0)return;const p=G.p;if(G.mode==='swim')return;if(!p.star){addText(p.x,p.y,'Sem estrela: vá à Ilha Central','#ffd92e',false,3.6);return}if(G.isl===14&&!G.duel&&!(NET.on&&inArena(p)))return;if(p.powCd>0)return;const P=POW[p.star];

  p.en-=P.cost;p.powCd=P.cd*(1-.03*sl)}
function moveVec(){if(state!=='play'||(G&&G.frz>0))return{x:0,y:0,m:0};let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iy=(keys.KeyS?1:0)-(keys.KeyW?1:0);if(joy.on&&Math.hypot(joy.x-joy.x0,joy.y-joy.y0)>8){ix=clamp((joy.x-joy.x0)/46,-1,1);iy=clamp((joy.y-joy.y0)/46,-1,1)}

function watchRemote(){if(!/github\.io$/.test(location.hostname))return;const ck=()=>{fetch('control.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;STOP_AT=+j.stopAt||0;setLock(!!j.paused)}).catch(()=>{})};ck();setInterval(ck,20000)}

function meteors(dt){G.met-=dt;if(G.met<=0&&G.metOn<=0){G.met=300;G.metOn=30;if(G.isl===15)say('CHUVA DE METEOROS!','30 segundos: fuja das marcas no chão',3)}

    if(Math.hypot(G.p.x-V.x,G.p.y-V.y)<260)for(let i=0;i<3;i++)part(V.x+rand(-6,6),44,V.y+rand(-6,6),Math.random()<.5?0xff5a1f:0xffd23e,rand(-16,16),rand(20,44),rand(-16,16),rand(.8,1.6))}}
const esc=t=>String(t||'').replace(/[<>&"']/g,'');
function crewCol(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return new T.Color().setHSL(h/360,.75,.55).getHex()}

    '<input id="crN" maxlength="14" placeholder="Nome da tripulação" value="'+esc(c)+'" autocomplete="off" style="font:800 19px var(--body);padding:11px;border-radius:14px;border:3px solid var(--star);background:var(--night);color:var(--ink);text-align:center">';
  rows.push({t:c?'MUDAR O NOME':'CRIAR TRIPULAÇÃO',cls:'btn go',fn:()=>{const n=esc(($('crN').value||'').trim()).slice(0,14);if(!n)return nope();save.crew=n;store();openCrew('Tripulação '+n+' pronta!')}});
  if(c&&NET.on)for(const [id,o] of NET.others){const S=o.S;if(!S)continue;const same=S[18]===c;rows.push({cls:'up'+(same?' eq':''),t:'<i>'+starSvg(hx(PCOL[(o.ci|0)%PCOL.length]))+'</i><div><b>'+esc(S[12]||'Jogador')+'</b><span>Nível '+S[7]+(S[18]&&!same?' · tripulação '+esc(S[18]):'')+'</span></div><em>'+(same?'NA TRIPULAÇÃO':'CONVIDAR')+'</em>',fn:()=>{if(same)return nope();netTo(id,{t:'crew',name:c,nm:NET.nm});openCrew('Convite enviado para '+esc(S[12]||'Jogador'))}})}
  else if(c)head+='<p style="color:var(--muted)">Para convidar alguém, entre numa sala multiplayer com essa pessoa.</p>';
  if(c)rows.push({t:'SAIR DA TRIPULAÇÃO',fn:()=>{save.crew='';store();openCrew('Você saiu da tripulação.')}});
  rows.push({t:'VOLTAR AO JOGO',fn:play});overlay('',head,rows)}
function crewInvite(m){const n=esc(m.name).slice(0,14),who=esc(m.nm||'Um jogador');if(!n||save.crew===n)return;if(state!=='play'){addText(G.p.x,G.p.y,who+' convidou você para ['+n+']','#7dff9b',true,5);return}
  state='shop';joy.on=false;look.on=false;overlay('','<h2>CONVITE</h2><p><b>'+who+'</b> convidou você para a tripulação <b style="color:var(--ok)">'+n+'</b>.</p>',[{t:'ENTRAR NA TRIPULAÇÃO',cls:'btn go',fn:()=>{save.crew=n;store();play();say('TRIPULAÇÃO '+n.toUpperCase(),'Você entrou',2.6)}},{t:'RECUSAR',fn:play}])}
function buildDino(type){const b=EN[type],g=new T.Group(),bd=new T.Group(),c=M(b.suit),c2=M(shade(b.suit,.7)),c3=M(shade(b.suit,1.35));g.add(bd);g.body=bd;g.sc=b.sc;

    g.la=new T.Group();g.la.position.set(-.4,3.3,0);bd.add(g.la);const w1=mesh(GEO.box,c2,g.la,-1.3,0,0,2.6,.06,1);g.ra=new T.Group();g.ra.position.set(.4,3.3,0);bd.add(g.ra);mesh(GEO.box,c2,g.ra,1.3,0,0,2.6,.06,1);g.la.rotation.order=g.ra.rotation.order='ZXY';g.ll=dm();g.rl=dm();g.fly=1}
  else if(type==='trice'||type==='bronto'){const br=type==='bronto';mesh(GEO.sph,c,bd,0,1.15,0,.95,.8,1.5);mesh(GEO.cone,c2,bd,0,1.05,-2.1,.45,2.2,.45).rotation.x=-Math.PI/2;
    g.ll=leg(-.6,-.8,.9,.38);g.rl=leg(.6,-.8,.9,.38);g.la=leg(-.6,.8,.9,.38);g.ra=leg(.6,.8,.9,.38);
    if(br){const nk=mesh(GEO.cyl,c,bd,0,2.3,1.5,.3,2.6,.3);nk.rotation.x=.6;mesh(GEO.sph,c3,bd,0,3.5,2.35,.4,.32,.55);eye(-.28,3.6,2.6,.08);eye(.28,3.6,2.6,.08)}
    else{mesh(GEO.sph,c3,bd,0,1.3,1.75,.62,.56,.8);const fr=mesh(GEO.disc,M(shade(b.suit,.85),{side:T.DoubleSide}),bd,0,1.7,1.25,1.05);fr.rotation.x=-.25;mesh(GEO.cone,M(0xf3e6d0),bd,0,1.5,2.7,.12,.7,.12).rotation.x=1.2;for(const sx of[-1,1]){mesh(GEO.cone,M(0xf3e6d0),bd,sx*.38,1.95,2.3,.13,1.2,.13).rotation.x=1;eye(sx*.42,1.5,2.2,.09)}}}

    mesh(GEO.box,c,bd,0,2.25,1.05,.62,.6,1.15);mesh(GEO.box,c2,bd,0,1.95,1.2,.56,.16,1);for(let i=0;i<4;i++)mesh(GEO.cone,M(0xf4f1ff),bd,-.2+i*.13,2,1.6,.05,.2,.05).rotation.x=Math.PI;eye(-.3,2.45,1.3,.09);eye(.3,2.45,1.3,.09);
    g.ll=leg(-.38,-.1,1.15,.34);g.rl=leg(.38,-.1,1.15,.34);g.la=new T.Group();g.la.position.set(-.45,1.6,.75);bd.add(g.la);mesh(GEO.box,c2,g.la,0,-.22,0,.12,.45,.12);g.ra=new T.Group();g.ra.position.set(.45,1.6,.75);bd.add(g.ra);mesh(GEO.box,c2,g.ra,0,-.22,0,.12,.45,.12);
