<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05090a;font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:800;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(8,16,14,.42);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border:1px solid rgba(255,255,255,.16)}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:15px}
#hud .l{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#hud .row{display:flex;gap:6px;align-items:center}
#hud .row>span:not(:empty),#p2:not(:empty){padding:5px 11px;border-radius:999px;background:rgba(8,16,14,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);line-height:1.2}
#hearts{color:#ff4d67;font-size:18px;letter-spacing:3px;text-shadow:0 0 10px #ff2d5088}
#toks{color:#ffd24a;letter-spacing:2px}
#p2{font-size:12px;opacity:.95}
#pause{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(8,16,14,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:900 14px inherit;letter-spacing:2px}
#bossbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(46vw,420px);display:none;text-align:center;font-size:12px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 6px #000;pointer-events:none}
#bossbar i{display:block;height:9px;margin-top:4px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(0,0,0,.5);overflow:hidden}
#bossbar b{display:block;height:100%;background:linear-gradient(90deg,#ff9a3d,#ff2d55);box-shadow:0 0 12px #ff2d55;width:100%;transition:width .2s}
#banner{position:fixed;top:26%;left:0;right:0;text-align:center;font:400 30px "Lilita One","Nunito",sans-serif;letter-spacing:1px;text-shadow:0 4px 18px #000c,0 2px 0 #0008;pointer-events:none;opacity:0;transition:opacity .6s}
#pad{position:fixed;left:0;right:0;bottom:0;height:160px;display:none;pointer-events:none}
#dpad{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:22px;width:186px;height:86px;pointer-events:auto;display:flex;gap:12px}
#dpad div,.btn{display:flex;align-items:center;justify-content:center;color:#fff;border:1.5px solid rgba(255,255,255,.38);background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(255,255,255,.05) 70%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .06s,background .06s}
#dpad div{flex:1;border-radius:50%;font-size:24px}
#dpad div.on,.btn.on{transform:scale(.93);background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,.2) 70%)}
.btn{position:absolute;width:86px;height:86px;border-radius:50%;pointer-events:auto;font-size:28px}
#bJ{right:max(16px,env(safe-area-inset-right));bottom:26px;border-color:rgba(140,255,170,.7);box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 22px rgba(80,255,140,.3),inset 0 1px 0 rgba(255,255,255,.35)}
#bB{right:calc(max(16px,env(safe-area-inset-right)) + 98px);bottom:10px;font-size:32px;border-color:rgba(255,220,90,.75);box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 22px rgba(255,210,60,.3),inset 0 1px 0 rgba(255,255,255,.35)}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.6))}
#ui.menu{justify-content:flex-end;background:linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55))}
#ui.menu .panel{width:min(420px,52%)}
@media(orientation:portrait){#ui.menu{justify-content:center;align-items:flex-end;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.6))}#ui.menu .panel{width:100%;max-height:60%}}
.panel{width:min(520px,100%);max-height:100%;overflow:auto;background:rgba(10,20,18,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);touch-action:pan-y}
h1{margin:2px 0 4px;font:400 46px/0.92 "Lilita One","Nunito",sans-serif;letter-spacing:1.5px;background:linear-gradient(180deg,#fff3a8,#ffc21a 55%,#ff8a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(90,40,0,.7)) drop-shadow(0 10px 22px rgba(255,160,20,.35))}
h2{margin:2px 0 10px;font:400 24px "Lilita One","Nunito",sans-serif;letter-spacing:.5px;color:#ffd24a}
p{margin:6px 0;font-size:13.5px;font-weight:700;line-height:1.4;color:rgba(235,245,235,.85)}
button{font-family:inherit}
button.b{display:block;width:100%;margin:8px 0;padding:14px;border:0;border-radius:16px;background:linear-gradient(180deg,#ffe066,#ffb81a);color:#3a2200;font:900 17px inherit;box-shadow:0 6px 18px rgba(255,180,20,.3),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(160,90,0,.35)}
button.b:active{transform:translateY(1px) scale(.99)}
button.b.s{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none;font-size:15px;padding:12px}
button.b:disabled{opacity:.4}
.rowb{display:flex;gap:8px}.rowb .b{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.card{border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:9px 4px;background:rgba(255,255,255,.06);color:#fff;font:inherit}
.card.sel{border-color:#ffd24a;background:linear-gradient(180deg,rgba(255,210,74,.28),rgba(255,210,74,.08));box-shadow:0 0 18px rgba(255,200,60,.35)}
.card b{display:block;font-size:15px}.card small{display:block;font-size:10.5px;opacity:.8;font-weight:700}
.card .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 5px;border:2px solid rgba(255,255,255,.5);box-shadow:inset 0 -4px 6px rgba(0,0,0,.4)}
.world{display:flex;align-items:center;gap:6px;margin:6px 0;text-align:left}
.world span{flex:1;font-size:14.5px}
.st{width:54px;height:46px;border-radius:14px;border:0;background:linear-gradient(180deg,#ffe066,#ffb81a);color:#3a2200;font:900 16px inherit;box-shadow:inset 0 -3px 0 rgba(160,90,0,.35)}
.st:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);box-shadow:none}
.st small{display:block;font-size:9px}
input.code{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font:900 24px inherit;text-align:center;letter-spacing:8px;text-transform:uppercase}
.code-big{font:400 38px "Lilita One",sans-serif;letter-spacing:8px;color:#ffd24a}
label.chk{display:block;font-size:12.5px;margin:8px 0;color:rgba(235,245,235,.75)}
@media(max-width:430px){#dpad{width:164px;height:76px}.btn{width:78px;height:78px}#bB{right:calc(max(16px,env(safe-area-inset-right)) + 88px)}}
@media(max-height:420px){h1{font-size:36px}.panel{padding:12px 16px}button.b{padding:10px;margin:5px 0}p{margin:3px 0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="l"><div class="row"><span id="hearts"></span><span id="lives"></span></div><div class="row"><span id="bans"></span><span id="toks"></span></div><div id="p2"></div></div><button id="pause">II</button></div>

<div id="pad"><div id="dpad"><div id="dL">◀</div><div id="dR">▶</div></div><div class="btn" id="bB">🍌</div><div class="btn" id="bJ">▲</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const tri=(t,p)=>{t=((t%p)+p)%p;return t<p/2?t/(p/2):2-t/(p/2)};
const hash=k=>{const s=Math.sin(k*127.1)*43758.5453;return s-Math.floor(s)};

/* ---------- dados ---------- */
const CHARS=[
{name:'Bongo',sex:'♂',fur:0x2a2522,skin:0x3c3431,acc:'leaf',ab:'Banana forte',dmg:2},
{name:'Tambo',sex:'♂',fur:0x6a4526,skin:0x4a3a30,acc:'band',ab:'Veloz',spd:1.18},
{name:'Rocco',sex:'♂',fur:0x3a3d42,skin:0x36302d,acc:'silver',ab:'+1 coração',hp:4},
{name:'Zuri',sex:'♀',fur:0x40302a,skin:0x403438,acc:'flower',ab:'Pulo duplo',dj:1},
{name:'Maya',sex:'♀',fur:0x8a5632,skin:0x524038,acc:'bow',ab:'Planar',glide:1},
{name:'Kira',sex:'♀',fur:0x24242f,skin:0x3a3640,acc:'neck',ab:'Banana tripla',tri:1}];
const SEGS=['plain','gap','stairs','plats','vines','movers','fallers','spikes','shooter'];
const WORLDS=[
{name:'Selva',sky:['#2f8fe0','#bfe9ff','#e8f8d8'],fog:0xc4ecd2,ground:0x9a6c44,top:0x58c040,plat:0xb88a54,fallc:0xc9a063,sea:0x2f8fd0,en:0xc0392b,hemi:[0xffffff,0x4a7a3a,1],wt:[3,2,2,2,3,1,0,1,1],boss:{kind:'charge',name:'Besourão',hp:16,w:2.6,h:2,stomp:1}},
{name:'Caverna',sky:['#06070e','#141428','#241c3a'],fog:0x1c1c30,ground:0x6a6684,top:0x8480a0,plat:0x9a94b4,fallc:0x9a8ab0,sea:0x05060c,en:0x8e44ad,hemi:[0x8a90c8,0x201a30,.75],extra:'drop',wt:[2,2,2,2,1,2,2,2,1],boss:{kind:'fly',name:'Morcegão',hp:20,w:2.6,h:1.6,stomp:1}},
{name:'Árvore Gigante',sky:['#5fc0e8','#d8f8c0','#f8ffe0'],fog:0xcff0b8,ground:0x9a6a3c,top:0x84cc40,plat:0xa87a44,fallc:0xb8d86a,sea:0xe8ffe0,en:0xd35400,hemi:[0xffffe0,0x3a6a2a,1],wt:[1,1,2,3,4,2,2,0,1],boss:{kind:'spider',name:'Aranha Rainha',hp:22,w:2.4,h:1.8,stomp:1}},
{name:'Montanha',sky:['#2f78d8','#a8d0f8','#f4f9ff'],fog:0xdcecff,ground:0x94a2b6,top:0xf2f8ff,plat:0xb4cae0,fallc:0xcfe4f5,sea:0xffffff,en:0x2980b9,hemi:[0xffffff,0x8090a8,1.05],ice:1,wt:[2,3,3,2,1,2,2,2,2],boss:{kind:'yeti',name:'Yeti',hp:26,w:2.6,h:2.6,stomp:1}},
{name:'Vulcão',sky:['#120406','#5a1608','#e0601a'],fog:0x5a1a10,ground:0x4a3c38,top:0x5e4c46,plat:0x74605a,fallc:0x8a5a40,sea:0xff5a10,en:0xe67e22,hemi:[0xd0a090,0x30100a,.7],extra:'fire',lava:1,wt:[2,3,1,2,2,3,3,1,2],boss:{kind:'golem',name:'Golem de Lava',hp:26,w:2.6,h:2.8,stomp:0}},
{name:'Castelo',sky:['#05061a','#1a1838','#3a2850'],fog:0x1e1a34,ground:0x8a8a9c,top:0xa0a0b2,plat:0x9a6e52,fallc:0x9a7a5a,sea:0x0a1420,en:0x7f1d3a,hemi:[0x9098b8,0x201c28,.7],extra:'both',wt:[2,2,2,2,2,3,2,3,3],boss:{kind:'king',name:'Rei Sombrio',hp:38,w:2.2,h:2.8,stomp:1}}];
const STAGES=[];for(let w=0;w<6;w++)for(let n=0;n<3;n++)STAGES.push({w,n,boss:n===2,len:330+w*24+n*30,d:(w*2+n)/11});
const EN={walk:{w:.9,h:.8,stomp:1,kill:1},spike:{w:.9,h:.8,stomp:0,kill:1},hop:{w:.8,h:.8,stomp:1,kill:1},fly:{w:1,h:.6,stomp:1,kill:1},shoot:{w:.9,h:1.1,stomp:1,kill:1},fire:{w:.7,h:.7,stomp:0,kill:0},drop:{w:.7,h:1,stomp:0,kill:0}};

/* ---------- gerador de fases ---------- */
function buildLevel(si){
 const S=STAGES[si],W=WORLDS[S.w],R=rng(1000+si*77),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),d=S.d;
 const L={si,w:S.w,solids:[],haz:[],vines:[],en:[],items:[],cps:[],boss:null,goal:null,t:0,ice:!!W.ice,killY:-5,startY:2};
 let cx=0,g=2,eid=0,iid=0,ntok=0;
 const ground=w=>{const s={x:cx,y:g,w,h:40,full:1};L.solids.push(s);cx+=w;return s};
 const plat=(x,y,w,o)=>{const s=Object.assign({x,y,w,h:.5,x0:x,y0:y,px:x,py:y,dx:0},o);L.solids.push(s);return s};
 const en=(type,x,y,o)=>{L.en.push(Object.assign({id:eid++,type,x,y,x0:x,y0:y,alive:1,dir:-1},EN[type],o))};
 const item=(kind,x,y)=>{L.items.push({id:iid++,kind,x,y,got:0,k:kind==='token'?ntok++:0})};
 const row=(x0,y,n,arc)=>{for(let i=0;i<n;i++)item('banana',x0+i,y+(arc?Math.sin(i/Math.max(1,n-1)*Math.PI)*arc:0))};
 const gEnemy=s=>{if(s.w<6)return;const r=R(),t=r<.2+d*.35?'spike':r<.78?'walk':'hop';
  if(t==='hop')en('hop',s.x+s.w*.6,g,{hh:1.6+d,om:3,ph:R()*6});else en(t,s.x+2,g,{x1:s.x+s.w-1.5,sp:1.5+d*1.8,ph:R()*5})};
 const extra=(x,inPit)=>{const e=W.extra;if(!e)return;
  if(inPit&&(e==='fire'||e==='both')&&R()<.65)en('fire',x,g-5,{hh:8.2,per:2.6,ph:R()*2.6});
  if(!inPit&&(e==='drop'||e==='both')&&R()<.5)en('drop',x,g+7,{floor:g,per:2.6+R(),ph:R()*3})};
 const SEG={
 plain(){const w=ri(8,12),s=ground(w);if(R()<.85)gEnemy(s);if(R()<.3+d*.4)en('fly',s.x+w/2,g+2.8,{ax:2.5,ay:.7,om:1.3,ph:R()*6});row(s.x+2,g+1.2,ri(3,5));extra(s.x+w-3,0)},
 gap(){const gw=ri(2,2+Math.round(d*2));row(cx+.2,g+1.6,Math.max(2,gw),1.3);extra(cx+gw/2,1);cx+=gw;const s=ground(ri(5,7));if(R()<d)gEnemy(s)},
 stairs(){const dir=g>=6?-1:g<=1?1:R()<.55?1:-1,n=ri(2,4);for(let i=0;i<n;i++){g=clamp(g+dir*ri(1,2),0,8);const s=ground(ri(3,5));if(i===n-1){item('banana',s.x+1.5,g+1.2)}else if(R()<.3+d*.3&&s.w>=4)en('hop',s.x+s.w/2+.5,g,{hh:1.5,om:3,ph:R()*6})}},
 plats(){let x=cx+1.6,py=g,lastR=cx;const n=ri(3,4+(d>.5?1:0));for(let i=0;i<n;i++){const pw=ri(4,6)/2;py=clamp(py+ri(-1,1),g-1,g+2);plat(x,py,pw);item('banana',x+pw/2,py+1.2);lastR=x+pw;x=lastR+ri(16,24+Math.round(d*6))/10}
  if(R()<d)en('fly',(cx+lastR)/2,g+3.6,{ax:2.5,ay:.6,om:1.4,ph:R()*6});extra((cx+lastR)/2,1);cx=lastR+1.8;ground(ri(5,7))},
 vines(){const n=1+(d>.2?1:0)+(d>.55&&R()<.6?1:0),a0=cx+4.5;for(let k=0;k<n;k++){L.vines.push({ax:a0+8*k,ay:g+7.5,L:6,amp:.78,om:1.7,ph:k%2?Math.PI:0});item('banana',a0+8*k,g+2.2)}cx=a0+8*(n-1)+4.5;ground(ri(5,7))},
 movers(){const n=1+(d>.45?1:0);for(let k=0;k<n;k++){plat(cx+3+k*9,g,3,{mv:1,ax:2.8,ay:0,om:1.3,ph:k*Math.PI});item('banana',cx+4.5+k*9,g+1.3)}extra(cx+4.5,1);cx+=9*n+.5;ground(ri(5,7))},
 fallers(){const n=ri(3,5);for(let i=0;i<n;i++){plat(cx+1.5+i*3.5,g,2,{fall:1,ft:0,fv:0});item('banana',cx+2.5+i*3.5,g+1.2)}cx+=1.5+n*3.5;ground(ri(5,7))},
 spikes(){const w=ri(11,13),s=ground(w),k=1+(d>.4?1:0);for(let i=0;i<k;i++){const sw=ri(2,3),sx=s.x+3+i*5;L.haz.push({x:sx,y:g,w:sw,h:.45});row(sx,g+1.8,sw,1)}extra(s.x+w-2,0)},
 shooter(){const w=ri(10,12),s=ground(w);en('shoot',s.x+w-2,g,{per:2.3-d*.7,ph:R()*2});row(s.x+2,g+1.2,3)},
 bonus(){const s=ground(9);plat(s.x+1.5,g+2.4,2.5);plat(s.x+5,g+4.6,2.5);item('token',s.x+6.25,g+5.7);if(R()<.5)item('heart',s.x+2.75,g+3.4)},
 cp(){const s=ground(7);L.cps.push({x:s.x+3.5,y:g})}};
 if(S.boss){g=2;const s=ground(44);plat(7,g+2.6,4);plat(33,g+2.6,4);plat(20,g+4.9,4);L.len=44;L.boss=Object.assign({x:30,y:g,g,max:W.boss.hp,dmg:0,st:0,hitT:0,dead:0,wasLand:1},W.boss);item('heart',22,g+6);return L}
 ground(12);row(6,g+1.2,4);let last='',nb=0,nc=0;const tw=W.wt.reduce((a,b)=>a+b,0);
 const pick=()=>{let r=R()*tw;for(let i=0;i<SEGS.length;i++){r-=W.wt[i];if(r<0)return SEGS[i]}return'plain'};
 while(cx<S.len){const f=cx/S.len;
  if(nb<3&&f>=[.12,.42,.68][nb]){SEG.bonus();nb++;continue}
  if(nc<4&&f>=[.2,.4,.6,.8][nc]){SEG.cp();nc++;continue}
  let k;do{k=pick()}while(k===last);last=k;SEG[k]()}
 const s=ground(16);L.goal={x:s.x+11,y:g};L.len=cx;return L}

/* ---------- estado ---------- */
const G={mode:'menu',si:0,ch:0,L:null,P:null,ban:[],bul:[],cp:-1,coop:false,clearT:0,all:false};
const keys={l:0,r:0,j:0,b:0};

 setup();setTimeout(()=>{if(!done){done=true;closed=true;clearInterval(tm);rej(new Error('timeout'))}},14000)})}
async function netJoin(code,host){const ns=await netInit();const rm=ns?await ns.join('gj-'+code.toLowerCase()):await peerJoin(code,host);net.rm=rm;net.code=code;net.host=host;net.peer=null;net.run=0;G.coop=true;
 net.un=rm.onPeers(c=>netPeers(c.peers),()=>{net.rm=null;net.peer=null});netSend(true)}
function netLeave(){try{net.un&&net.un();net.rm&&net.rm.leave()}catch(e){}net.rm=null;net.peer=null;G.coop=false}
function netPeers(peers){let best=null;for(const q of peers){if(q.isMe||q.kind!=='viewer')continue;const pr=q.presence||{};if(typeof pr.ch!=='number')continue;if(net.host?!pr.h:!!pr.h){best=pr;break}}
 net.peer=best;const sg=best?best.ch+'|'+(best.st<0):'-';if(G.mode==='menu'&&sg!==net.sg&&scr.cur)scr.cur(true);net.sg=sg;
 if(best&&!net.host){const st=best.st|0,run=best.run|0;if(st>=0&&st<18&&run&&run!==net.run){net.run=run;startStage(st)}else if(st<0&&G.mode!=='menu'&&net.run){net.run=0;toMenu(scrStages)}}}
function netSend(force){if(!net.rm)return;const now=performance.now();if(!force&&now-net.lastSend<85)return;net.lastSend=now;const p=G.P,play=G.mode!=='menu';
 const o={h:net.host?1:0,ch:G.ch,st:play?G.si:-1,run:net.run};
 if(play&&p)Object.assign(o,{x:+p.x.toFixed(2),y:+p.y.toFixed(2),vx:+p.vx.toFixed(1),vy:+p.vy.toFixed(1),f:p.f,on:p.on?1:0,vn:p.vine?1:0,hp:p.hearts,lv:p.lives,dn:p.down?1:0,cp:G.cp,bd:p.dmg,done:p.done,dead:p.dead_ids.join(','),tok:p.tok.join(','),t:+G.L.t.toFixed(2),th:p.th});
 net.rm.presence(o).catch(()=>{})}
let lastTh=0;
function netMerge(){const pe=net.peer,p=G.P,L=G.L;if(!G.coop||!pe||G.mode==='menu'||pe.st!==G.si||pe.run!==net.run)return;
 if(typeof pe.dead==='string'&&pe.dead!==netMerge.d){netMerge.d=pe.dead;for(const s of pe.dead.split(',')){const e=L.en[s|0];if(s!==''&&e&&e.alive)killEnemy(e,0)}}
 if(typeof pe.tok==='string'&&pe.tok)for(const s of pe.tok.split(',')){const k=s|0;if(k>=0&&k<3&&!p.tok.includes(k)){p.tok.push(k);const it=L.items.find(i=>i.kind==='token'&&i.k===k);if(it){it.got=1;it.m.visible=false}}}
 const cp=pe.cp|0;if(cp>G.cp&&cp<L.cps.length)G.cp=cp;
 if(p.down&&G.cp>p.downCp){p.down=0;p.lives=3;respawn(p);banner('Você voltou!')}
 if(pe.done&&G.mode==='play')complete();
 if(!net.host&&typeof pe.t==='number'){const df=pe.t+.1-L.t;if(Math.abs(df)>2)L.t=pe.t+.1;else if(Math.abs(df)>.05)L.t+=df*.03}
 if(Array.isArray(pe.th)&&pe.th[0]!==lastTh){lastTh=pe.th[0];const f=pe.th[3]<0?-1:1,x=+pe.th[1]||0,y=+pe.th[2]||0;const m=mk(TOR,mat(0xffd83a,0x403000),scene,x,y+.9,.3,.16,.16,.24);G.ban.push({x,y:y+.9,vx:f*13,vy:4,life:1.5,m,ghost:1,d:0})}
 if(G.mode==='play'&&p.down&&pe.dn){G.mode='over';music(false);scrOver()}}

/* ---------- telas ---------- */
const scr={cur:null};
function ui(h){const u=$('ui');u.innerHTML=h?'<div class="panel">'+h+'</div>':'';u.style.display=h?'flex':'none';u.className=G.mode==='menu'?'menu':''}
function toMenu(next){startStage(prog.un>0?Math.min(prog.un,17)-(STAGES[Math.min(prog.un,17)].boss?1:0):0,true);(next||scrTitle)()}
function scrTitle(){scr.cur=scrTitle;ui('<h1>GORILLA<br>JUNGLE</h1><p style="letter-spacing:3px;text-transform:uppercase;font-size:11px">Seis mundos · Uma selva inteira</p><button class="b" data-a="solo">Jogar sozinho</button><button class="b" data-a="coop">Jogar em dupla</button><div class="rowb"><button class="b s" data-a="fs">Tela cheia</button><button class="b s" data-a="mute">Som: '+(mute?'desligado':'ligado')+'</button></div><button class="b s" data-a="q">Gráficos: '+(Qauto?'automático':['leve','médio','alto'][Q])+'</button><p>◀ ▶ mover · ▲ pular · 🍌 arremessar<br>Pule nos cipós para se agarrar e aperte ▲ para soltar.</p>')}
function scrCoop(msg){scr.cur=null;ui('<h2>Jogar em dupla</h2><p>Cada um no seu celular, com este mesmo jogo aberto.</p><button class="b" data-a="create">Criar sala</button><p>ou entre com o código do parceiro:</p><input class="code" id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off"><button class="b" data-a="join">Entrar na sala</button><p style="color:#ffd83a">'+(msg||'')+'</p><button class="b s" data-a="back">Voltar</button>')}
function scrChars(re){scr.cur=scrChars;const pe=net.peer;let h='<h2>Escolha seu gorila</h2>';
 if(G.coop)h+='<p>Sala <span class="code-big">'+net.code+'</span><br>'+(pe?'Parceiro conectado: '+CHARS[clamp(pe.ch|0,0,5)].name:'Aguardando o parceiro entrar com o código…')+'</p>';
 h+='<div class="grid">'+CHARS.map((c,i)=>'<button class="card'+(i===G.ch?' sel':'')+'" data-a="ch" data-v="'+i+'"><div class="dot" style="background:#'+c.fur.toString(16).padStart(6,'0')+'"></div><b>'+c.name+' '+c.sex+'</b><small>'+c.ab+'</small></button>').join('')+'</div>';
 h+='<button class="b" data-a="tostages">Continuar</button><button class="b s" data-a="back">Voltar</button>';ui(h)}
function scrStages(){scr.cur=scrStages;let h='<h2>Mapa dos mundos</h2>';
 if(G.coop&&!net.host){ui(h+'<p>Sala <b>'+net.code+'</b></p><p>'+(net.peer?'Aguardando o anfitrião escolher a fase…':'Procurando a sala… confira o código com seu parceiro.')+'</p><button class="b s" data-a="chars">Trocar gorila</button><button class="b s" data-a="back">Sair da sala</button>');return}
 if(G.coop)h+='<p>Sala <b>'+net.code+'</b> · '+(net.peer?'parceiro pronto':'aguardando parceiro (pode começar sem ele)')+'</p>';
 WORLDS.forEach((W,w)=>{h+='<div class="world"><span>'+(w+1)+'. '+W.name+'</span>';for(let n=0;n<3;n++){const si=w*3+n,ok=G.all||si<=prog.un,t=(prog.tok[si]||[]).filter(Boolean).length;h+='<button class="st" data-a="play" data-v="'+si+'"'+(ok?'':' disabled')+'>'+(ok?(n===2?'👑':n+1):'🔒')+(n<2&&ok?'<small>'+'★'.repeat(t)+'☆'.repeat(3-t)+'</small>':'')+'</button>'}h+='</div>'});
 h+='<label class="chk"><input type="checkbox" id="all"'+(G.all?' checked':'')+'> Liberar todas as fases (modo teste)</label><button class="b s" data-a="chars">Trocar gorila</button><button class="b s" data-a="back">Voltar</button>';ui(h);$('all').onchange=e=>{G.all=e.target.checked;scrStages()}}
function scrPause(){ui('<h2>Pausa</h2>'+(G.coop?'<p>Em dupla o jogo continua para o parceiro.</p>':'')+'<button class="b" data-a="resume">Continuar</button>'+(G.coop&&!net.host?'':'<button class="b s" data-a="retry">Recomeçar a fase</button>')+'<div class="rowb"><button class="b s" data-a="fs">Tela cheia</button><button class="b s" data-a="mute">Som: '+(mute?'desligado':'ligado')+'</button></div><button class="b s" data-a="quit">Sair para o mapa</button>')}
function scrClear(){const p=G.P,S=STAGES[G.si],end=G.si===17,guest=G.coop&&!net.host;ui('<h2>'+(end?'Você zerou o Gorilla Jungle!':S.boss?'Chefão derrotado!':'Fase concluída!')+'</h2><p>🍌 '+p.ban+(S.boss?'':' · Estrelas '+'★'.repeat(p.tok.length)+'☆'.repeat(3-p.tok.length))+'</p>'+(guest?'<p>Aguardando o anfitrião…</p><button class="b s" data-a="quit">Sair da partida</button>':(end?'':'<button class="b" data-a="next">Próxima fase</button>')+'<button class="b s" data-a="quit">Mapa dos mundos</button>'))}
function scrOver(){const guest=G.coop&&!net.host;ui('<h2>Fim de jogo</h2><p>As vidas acabaram.</p>'+(guest?'<p>Aguardando o anfitrião…</p><button class="b s" data-a="quit">Sair da partida</button>':'<button class="b" data-a="retry">Tentar de novo</button><button class="b s" data-a="quit">Mapa dos mundos</button>'))}
function hostStart(si){if(G.coop)net.run=1+Math.floor(Math.random()*1e6);startStage(si)}
function act(a,v){audio();
 if(a==='solo'){G.coop=false;scrChars()}
 else if(a==='coop')scrCoop();
 else if(a==='create'){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];scrCoop('Conectando…');netJoin(c,true).then(()=>scrChars()).catch(()=>scrCoop('Não foi possível conectar. Confira a internet e tente de novo.'))}
 else if(a==='join'){const c=($('code').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4){scrCoop('Digite as 4 letras do código.');return}scrCoop('Conectando…');netJoin(c,false).then(()=>scrChars()).catch(()=>scrCoop('Não foi possível conectar. Confira a internet e tente de novo.'))}
 else if(a==='ch'){G.ch=+v;scene.remove(pMesh);pMesh=mkGorilla(CHARS[G.ch]);scene.add(pMesh);G.P.c=CHARS[G.ch];netSend(true);scrChars();beep(440,.08)}
 else if(a==='chars')scrChars();
 else if(a==='tostages')scrStages();
 else if(a==='back'){if(scr.cur===scrStages&&!(G.coop&&!net.host))scrChars();else{if(G.coop)netLeave();scrTitle()}}
 else if(a==='play')hostStart(+v);
 else if(a==='resume'){G.mode='play';ui('')}
 else if(a==='retry')hostStart(G.si);
 else if(a==='next')hostStart(Math.min(17,G.si+1));
 else if(a==='quit'){net.run=0;toMenu(scrStages)}
 else if(a==='fs'){try{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else{const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);r&&r.then&&r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}}catch(e){}}
 else if(a==='q'){if(Qauto){Qauto=false;Q=2}else if(Q>0)Q--;else{Qauto=true;Q=2}try{localStorage.setItem('gj_q',Qauto?'a':Q)}catch(e){}applyQ();scrTitle()}
 else if(a==='mute'){mute=!mute;if(!mute)audio();if(G.mode==='pause')scrPause();else scrTitle()}}
$('ui').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
$('pause').addEventListener('click',()=>{if(G.mode==='play'){G.mode='pause';scrPause()}});

/* ---------- controles ---------- */
function bindBtn(el,k){const on=e=>{e.preventDefault();keys[k]=1;el.classList.add('on');audio()},off=e=>{e.preventDefault();keys[k]=0;el.classList.remove('on')};el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(x){}on(e)});el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off)}
bindBtn($('bJ'),'j');bindBtn($('bB'),'b');
{const d=$('dpad');let id=null;const set=e=>{const r=d.getBoundingClientRect(),l=e.clientX<r.left+r.width/2;keys.l=l?1:0;keys.r=l?0:1;$('dL').classList.toggle('on',l);$('dR').classList.toggle('on',!l)},clr=()=>{keys.l=keys.r=0;id=null;$('dL').classList.remove('on');$('dR').classList.remove('on')};
 d.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{d.setPointerCapture(id)}catch(x){}set(e);audio()});d.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});d.addEventListener('pointerup',e=>{if(e.pointerId===id)clr()});d.addEventListener('pointercancel',clr)}
const KM={ArrowLeft:'l',ArrowRight:'r',a:'l',d:'r',' ':'j',ArrowUp:'j',w:'j',x:'b',k:'b',Enter:'b'};
window.addEventListener('keydown',e=>{const k=KM[e.key];if(k&&e.target.tagName!=='INPUT'){keys[k]=1;e.preventDefault();audio()}});window.addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
window.addEventListener('blur',()=>{keys.l=keys.r=keys.j=keys.b=0});
document.addEventListener('contextmenu',e=>e.preventDefault());

if(!T){document.body.innerHTML='<p style="padding:20px">Não foi possível carregar o motor 3D. Verifique a conexão e recarregue.</p>';return}
initThree();toMenu();requestAnimationFrame(frame);
window.GJ={netSend,act,G,keys,step,startStage,buildLevel,STAGES,WORLDS,CHARS,net,vAng,render,setQ:(q,auto)=>{Q=q;Qauto=!!auto;applyQ()}};
